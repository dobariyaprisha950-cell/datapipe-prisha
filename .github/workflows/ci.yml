name: CI
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: uv lock
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv pip install --editable examples/plugin
      - run: uv run ruff check .
      - run: uv run mypy src/
      - run: uv run pytest --cov=datapipe.core --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: POSIX SIGINT and SIGTERM integration tests
        run: uv run pytest tests/test_signal_shutdown.py -vv
      - run: uv run pip-audit
      - run: uv build
