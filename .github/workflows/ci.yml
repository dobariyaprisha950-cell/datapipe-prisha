name: CI
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv pip install --editable examples/plugin
      - run: uv run ruff check .
      - run: uv run mypy src/
      - run: mkdir -p work
      - run: uv run pytest --cov=datapipe.core --cov-branch --cov-report=term-missing --cov-report=json:work/core-coverage.json --cov-fail-under=85
      - name: Enforce core branch coverage threshold
        run: uv run python scripts/check_branch_coverage.py work/core-coverage.json --minimum 85
      - name: POSIX SIGINT and SIGTERM integration tests
        run: uv run pytest tests/test_signal_shutdown.py -vv
      - run: uv run pip-audit
      - run: uv build
      - name: Verify source distribution contents
        run: uv run python scripts/verify_sdist.py dist/
      - name: Install and smoke-test the source distribution
        run: |
          uv venv work/sdist-check --python '${{ matrix.python-version }}'
          uv pip install --python work/sdist-check/bin/python dist/*.tar.gz
          work/sdist-check/bin/python -c "import datapipe; from importlib.metadata import version; assert version('datapipe-prisha') == '0.1.0'; assert 'site-packages' in datapipe.__file__; print(datapipe.__file__)"
          work/sdist-check/bin/datapipe --version
          work/sdist-check/bin/datapipe --help
          work/sdist-check/bin/datapipe validate-config examples/demo-pipeline-fresh.yaml
          work/sdist-check/bin/datapipe run examples/demo-pipeline-fresh.yaml --json
          test -s work/demo-output-fresh/summary.json
