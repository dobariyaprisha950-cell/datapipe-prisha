name: Publish TestPyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = {version, f"v{version}"}
          actual = os.environ["RELEASE_TAG"]
          assert actual in expected, f"release tag {actual!r} does not match {version!r}"
          print(f"release tag {actual} matches package version {version}")
          PY
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv pip install --editable examples/plugin
      - run: uv run ruff check .
      - run: uv run mypy src/
      - run: mkdir -p work
      - run: uv run pytest --ignore=tests/test_signal_shutdown.py --cov=datapipe.core --cov-branch --cov-report=term-missing --cov-report=json:work/core-coverage.json --cov-fail-under=85
      - name: Enforce core branch coverage threshold
        run: uv run python scripts/check_branch_coverage.py work/core-coverage.json --minimum 85
      - name: Run real POSIX signal and resume tests
        run: uv run pytest tests/test_signal_shutdown.py -vv
      - run: uv run pip-audit
      - run: uv build
      - name: Verify source distribution contents
        run: uv run python scripts/verify_sdist.py dist/
      - name: Validate wheel and source distribution metadata
        run: uvx --from twine twine check dist/*
      - name: Verify expected distribution files
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {path.name for path in Path("dist").glob("*")}
          wheels = [name for name in files if name.endswith(".whl")]
          sdists = [name for name in files if name.endswith(".tar.gz")]
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected_prefix = f"{project['name'].replace('-', '_')}-{project['version']}"
          assert len(wheels) == 1, f"expected one wheel, got {wheels}"
          assert len(sdists) == 1, f"expected one sdist, got {sdists}"
          assert wheels[0].startswith(expected_prefix), wheels[0]
          assert sdists[0].startswith(expected_prefix), sdists[0]
          print(f"validated {wheels[0]} and {sdists[0]}")
          PY
      - name: Install wheel in a clean environment and check CLI
        run: |
          uv venv work/wheel-check --python 3.12
          uv pip install --python work/wheel-check/bin/python dist/*.whl
          work/wheel-check/bin/datapipe --version
      - name: Install and smoke-test the source distribution
        run: |
          uv venv work/sdist-check --python 3.12
          uv pip install --python work/sdist-check/bin/python dist/*.tar.gz
          work/sdist-check/bin/python -c "import datapipe; from importlib.metadata import version; assert version('datapipe-prisha') == '0.1.0'; assert 'site-packages' in datapipe.__file__; print(datapipe.__file__)"
          work/sdist-check/bin/datapipe --help
          work/sdist-check/bin/datapipe validate-config examples/demo-pipeline-fresh.yaml
          work/sdist-check/bin/datapipe run examples/demo-pipeline-fresh.yaml --json
          test -s work/demo-output-fresh/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI
    needs: validate
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist
      - name: Publish distributions with GitHub OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
